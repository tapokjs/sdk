name: publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global "bun@$(cat .bun-version)"
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit
      - run: bun pm pack --ignore-scripts --destination "$RUNNER_TEMP"
      - name: Publish checked archive with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/*.tgz --access public --provenance
